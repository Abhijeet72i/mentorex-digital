<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" fill="none">
  <defs>
    <!-- Emblem Gradients -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orangeArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="orangeText3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON ================= -->
  <g transform="translate(15, 6)">
    <!-- Ambient back glow behind crest -->
    <circle cx="55" cy="50" r="38" fill="#0284c7" opacity="0.15" filter="url(#softGlow)"/>

    <!-- Dual Radiant Swoosh Wings: Outer Orange Arc -->
    <path d="M 16 50 C 22 75, 45 88, 55 88 C 65 88, 88 75, 94 50 C 88 70, 68 81, 55 81 C 42 81, 22 70, 16 50 Z" 
          fill="url(#orangeArc)" filter="url(#softGlow)"/>

    <!-- Dual Radiant Swoosh Wings: Inner Cyan Arc -->
    <path d="M 22 55 C 28 72, 45 80, 55 80 C 65 80, 82 72, 88 55 C 82 67, 66 74, 55 74 C 44 74, 28 67, 22 55 Z" 
          fill="url(#cyanArc)"/>

    <!-- Modern Mortarboard Cap Diamond Top -->
    <polygon points="55,18 84,31 55,44 26,31" 
             fill="url(#capGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Cap Under-band Rim -->
    <polygon points="36,36 55,45 74,36 74,42 55,51 36,42" 
             fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>

    <!-- Tassel dangling on right -->
    <path d="M 84 31 Q 88 40 86 52" stroke="#fb923c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="86" cy="52" r="2.2" fill="#f97316"/>

    <!-- Geometric Shield / Mask facets inside -->
    <polygon points="42,47 55,60 49,70 38,58" fill="#0284c7" opacity="0.85"/>
    <polygon points="68,47 55,60 61,70 72,58" fill="#38bdf8" opacity="0.95"/>
    <polygon points="55,60 49,70 55,73 61,70" fill="#f97316"/>

    <!-- Star Accent Sparkles -->
    <circle cx="20" cy="46" r="1.5" fill="#38bdf8"/>
    <circle cx="90" cy="46" r="1.5" fill="#38bdf8"/>
    <circle cx="55" cy="14" r="1.2" fill="#fb923c"/>
  </g>

  <!-- ================= TYPOGRAPHY WORDMARK ================= -->
  <!-- "Mentor" -->
  <text x="132" y="65" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="48" 
        font-weight="800" 
        letter-spacing="-0.5" 
        fill="#4f96df">
    Mentor
  </text>

  <!-- "Ex" in 3D Orange with Bevel Shadow -->
  <!-- Drop shadow for 3D depth -->
  <text x="312" y="66" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="-0.5" 
        fill="#9a3412">
    Ex
  </text>
  <!-- Main face -->
  <text x="311" y="65" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="-0.5" 
        fill="url(#orangeText3d)">
    Ex
  </text>

  <!-- Subtitle: "— A DIGITAL CHOICE. —" -->
  <text x="180" y="87" 
        font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" 
        font-size="11.5" 
        font-weight="600" 
        letter-spacing="3.8" 
        fill="#60a5fa" 
        opacity="0.85">
    — A DIGITAL CHOICE. —
  </text>
</svg>
